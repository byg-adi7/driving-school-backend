name: CI

# Deployment is not done here: Render deploys main itself through its GitHub
# integration. With the service's Auto-Deploy set to "After CI Checks Pass",
# Render waits for the jobs below to succeed on a push to main before
# deploying, and skips the deploy if any of them fail.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: project-with-changes

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: project-with-changes/pom.xml

      - name: Build and run tests
        # DB_PASSWORD/JWT_SECRET are placeholder values satisfying the app's
        # fail-fast startup check for the app's own datasource config.
        # SchemaValidationTest uses a separate Testcontainers-managed Postgres
        # (real Docker daemon access, provided by this runner) - these two
        # values are unrelated to that.
        env:
          DB_PASSWORD: ci_build_only
          JWT_SECRET: ci_build_only_secret_at_least_32_characters_long
        run: mvn -B clean verify

      - name: Upload coverage report
        # Visibility only - no threshold enforced, so this step always runs
        # even though nothing else in the pipeline gates on its content.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: project-with-changes/target/site/jacoco/
          retention-days: 30

      - name: Upload static analysis report
        # Same visibility-only deal as coverage above - SpotBugs never fails
        # the build here, it just needs somewhere to land so it's inspectable
        # (open in the SpotBugs IDE plugin, or any SARIF/XML viewer).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: project-with-changes/target/spotbugsXml.xml
          retention-days: 30

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: project-with-changes
          push: false
          tags: driving-school-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
