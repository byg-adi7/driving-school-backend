spring:
  jpa:
    hibernate:
     # ddl-auto intentionally NOT overridden to "update" here: that setting is
     # exactly what let V8/V9's schema drift go undetected for so long (each
     # dev's local database got silently auto-patched instead of failing loudly
     # like a fresh environment would). Inherits application.yml's ddl-auto:
     # validate instead, so local dev catches entity/migration mismatches the
     # same way CI and prod do. flyway.validate-on-migrate: false (also from
     # application.yml) still allows editing an unreleased migration file
     # during active development without a checksum failure.
     show-sql: true

app:
   bootstrap:
     admin:
       # Enable bootstrap admin for development convenience
       enabled: true
       # Development admin credentials - safe for dev only
       email: ${BOOTSTRAP_ADMIN_EMAIL:admin@dev.local}
       password: ${BOOTSTRAP_ADMIN_PASSWORD:DevPassword123!}

# Development: Allow Swagger docs and detailed error responses
server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
    include-exception: true

logging:
  level:
    root: DEBUG
    com.drivingschool.backend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
  file:
    name: logs/driving-school-backend-dev.log

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    # In dev: Swagger is publicly accessible (requires auth in prod)
    disable-swagger-default-url: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
