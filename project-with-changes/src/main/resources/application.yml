spring:
  application:
    name: driving-school-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:driving_school}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    defer-datasource-initialization: false

  servlet:
    multipart:
      # Spring's defaults (1MB per file, 10MB per request) sat far below the 50MB the
      # upload endpoints promise (app.storage.max-file-size-mb / FileValidator), so any
      # real PDF was rejected before our own checks ran - as a 500. Keep in step with it.
      max-file-size: 50MB
      max-request-size: 51MB

  sql:
    init:
      mode: never
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: false
    clean-disabled: true
    encoding: UTF-8
    schemas: public

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  http2:
    enabled: true
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 10000
    accept-count: 100
    connection-timeout: 30000ms
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    # Sessions: ended after 2 h without a refresh; at most 12 h without "remember me"
    # (7 days with it, the line above); admins at most 1 day either way.
    idle-timeout-ms: ${JWT_IDLE_TIMEOUT_MS:7200000}
    session-max-ms: ${JWT_SESSION_MAX_MS:43200000}
    admin-session-max-ms: ${JWT_ADMIN_SESSION_MAX_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  storage:
    # "local" (disk) or "gcs" (Google Cloud Storage). See application-prod.yml for gcs.
    provider: ${STORAGE_PROVIDER:local}

    # Maximum file size in megabytes
    max-file-size-mb: 50

    # Allowed MIME types (comma-separated). Currently only PDF is supported.
    allowed-mime-types: application/pdf

    local:
      # Base directory for storing uploaded files (used when provider=local).
      base-path: ./uploads

  bootstrap:
    admin:
      # Enable automatic creation of bootstrap admin on first startup
       enabled: true
      # Bootstrap admin email address - change after first login!
       email: ${BOOTSTRAP_ADMIN_EMAIL:admin@drivingschool.local}
      # Bootstrap admin password - MUST change after first login!
       # For production, use environment variable: BOOTSTRAP_ADMIN_PASSWORD
       # Empty default on purpose (not omitted): BootstrapAdminInitializer reads
       # this via Environment.getProperty(), which throws IllegalArgumentException
       # on an unresolvable placeholder rather than returning null - crashing the
       # whole app at startup instead of the graceful "skip creation, log an
       # error" behavior the initializer's own blank-check clearly intends.
       password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  mail:
    from: ${MAIL_FROM:}

  password-reset:
    # How long a requested reset link stays valid.
    token-expiration-ms: ${PASSWORD_RESET_TOKEN_EXPIRATION_MS:3600000}
    # Frontend page that reads the ?token= query param and calls reset-password.
    reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}

  invite:
    # Page that reads ?token= and calls /auth/invite/accept. Empty = next to the
    # reset-password page (PASSWORD_RESET_URL with /reset-password -> /accept-invite).
    accept-url: ${INVITE_ACCEPT_URL:}

  verification:
    # Whether login requires a verified account (one-time code by email/WhatsApp).
    # Switch off with VERIFICATION_REQUIRED=false only while real users can't receive
    # codes yet (e.g. no verified Resend domain). Accounts created meanwhile stay
    # unverified and verify at their next login once it's back on.
    required: ${VERIFICATION_REQUIRED:true}
    # Dev convenience only: when email delivery isn't configured (no
    # RESEND_API_KEY), log the one-time code instead of refusing to send it.
    # Never enable in production - anyone with log access could log in as anyone.
    log-codes-when-email-unconfigured: ${VERIFICATION_LOG_CODES:false}



springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  # Pre-existing indentation bug: `management:` was nested (wrongly) under
  # springdoc.swagger-ui with its own children dedented back out to the
  # top level, so none of this ever actually bound to `management.*` in
  # dev/test - endpoints ran on Spring Boot's hardcoded defaults instead.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always




logging:
  level:
    root: INFO
    com.drivingschool.backend: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/driving-school-backend.log

# OpenRouteService Configuration - directionsUrl/timeout are the same real API
# endpoint and a sane request timeout for every deployment, not per-account
# config, so they're fine as fixed defaults. apiKey is a real credential and has
# no fallback - read exclusively from OPENROUTE_API_KEY, same as the Resend config.
openroute:
  apiKey: ${OPENROUTE_API_KEY:}
  directionsUrl: https://api.openrouteservice.org/v2/directions/driving-car
  timeout: 5000

# Resend (https://resend.com) - transactional email over plain HTTPS, not raw
# SMTP. Railway blocks outbound SMTP entirely on non-Pro plans (and recommends
# an HTTPS-API provider regardless of plan), which is what made the previous
# JavaMailSender/SMTP setup unusable in production. No fallback default - a
# real credential, read exclusively from RESEND_API_KEY.
resend:
  apiKey: ${RESEND_API_KEY:}

# Twilio (https://twilio.com) - SMS over plain HTTPS via their REST API, same
# reasoning as Resend above (direct HTTPS call, no SDK dependency). Left
# entirely unset by default: TwilioConfig.isConfigured() checks all three are
# present, and SmsNotificationSender falls back to its existing safe
# "not configured" behavior until real credentials are added.
twilio:
  accountSid: ${TWILIO_ACCOUNT_SID:}
  authToken: ${TWILIO_AUTH_TOKEN:}
  fromNumber: ${TWILIO_FROM_NUMBER:}
  # Twilio Verify service for WhatsApp verification codes. WhatsApp stays
  # unavailable as a verification channel until this (and the SID/token above)
  # is set - users then verify by email only.
  verifyServiceSid: ${TWILIO_VERIFY_SERVICE_SID:}

