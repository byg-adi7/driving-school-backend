spring:
  application:
    name: driving-school-backend
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true
    clean-disabled: true
    encoding: UTF-8
    schemas: public

server:
  # Cloud Run injects PORT; GKE/other targets fall back to 8080.
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 10000
    accept-count: 100
    connection-timeout: 30000ms
    # Empty = strict validation (no relaxed characters allowed in query/path)
    relaxed-query-chars: ""
    relaxed-path-chars: ""
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  # No server.ssl block: TLS terminates at the platform (Cloud Run, or GKE
  # Ingress/managed cert) - the app always receives plain HTTP internally.
  # (http2.enabled was also removed: Tomcat's HTTP/2 support requires ALPN,
  # which requires TLS at this layer - it was a no-op without server.ssl.)

logging:
  level:
    root: WARN
    com.drivingschool.backend: INFO

  # Structured JSON logs (Spring Boot 3.4+ built-in, no extra dependency) so a
  # log aggregator can parse fields instead of regexing a plain-text line.
  # ECS format also folds in every MDC key automatically - including
  # requestId, which ApiVersioningFilter already populates - so request
  # correlation keeps working the same way it did with the old pattern.
  structured:
    format:
      console: ecs
      file: ecs
  file:
    name: logs/driving-school-backend.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        # prometheus here is still gated by SecurityConfig's
        # /actuator/** -> hasRole('ADMIN') rule - a real Prometheus server
        # scraping this needs either network-level access or a scrape
        # credential with that role; it isn't openly readable just because
        # it's listed here.
        #
        # No `exclude` line: Spring Boot's endpoint exposure is opt-in by
        # design (nothing is exposed unless listed in `include`), so a
        # separate `exclude: "*"` doesn't add safety - it silently wins over
        # `include` for every endpoint that isn't handled by a dedicated
        # mechanism outside this filter (health's liveness/readiness probes
        # are, which is the only reason health kept working with this
        # combination in place before - info and now prometheus were not).
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# Error tracking (Sentry). Deliberately no `sentry.dsn` key here: leaving it
# entirely unset lets the SDK no-op safely (it also checks the SENTRY_DSN
# env var itself), whereas a present-but-empty value like ${SENTRY_DSN:}
# throws InvalidDsnException at startup instead of disabling cleanly. Set
# the SENTRY_DSN env var to actually enable it.
sentry:
  environment: production
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.drivingschool.com}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With,X-API-Version,X-Request-ID
    allow-credentials: true
    max-age: 3600

  storage:
    provider: ${STORAGE_PROVIDER:cloudinary}
    max-file-size-mb: 50
    allowed-mime-types: application/pdf
    gcs:
      # No default-less placeholder here on purpose: with STORAGE_PROVIDER now
      # defaulting to cloudinary, a Cloudinary-only deploy that never sets
      # GCS_BUCKET_NAME would otherwise crash at startup on an unresolvable
      # placeholder for a provider it isn't even using. RequiredEnvironmentValidator
      # is the actual fail-fast check for "gcs selected but bucket name missing".
      bucket-name: ${GCS_BUCKET_NAME:}
      project-id: ${GCP_PROJECT_ID:}

  mail:
    from: ${MAIL_FROM:}

  password-reset:
    token-expiration-ms: ${PASSWORD_RESET_TOKEN_EXPIRATION_MS:3600000}
    reset-url: ${PASSWORD_RESET_URL:https://app.drivingschool.com/reset-password}
  bootstrap:
     admin:
        # DISABLED in production for security - must be explicitly enabled
        enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
        # Production admin email - set via environment variable
        email: ${BOOTSTRAP_ADMIN_EMAIL:admin@company.com}
        # Production admin password - MUST be set via environment variable
        # NEVER include actual passwords in configuration files
        password: ${BOOTSTRAP_ADMIN_PASSWORD}

springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
